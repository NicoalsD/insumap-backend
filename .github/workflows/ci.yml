name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint, tipos, arquitectura y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: insumap
          POSTGRES_PASSWORD: insumap
          POSTGRES_DB: insumap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insumap -d insumap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Base de datos desechable del job: las pruebas de integración aplican las
      # migraciones de insumap-database en la etiqueta de db-schema.lock.
      INSUMAP_TEST_DATABASE_URL: postgresql://insumap:insumap@localhost:5432/insumap
      INSUMAP_DATABASE_REPO_PATH: ${{ github.workspace }}/.insumap-database
    steps:
      - uses: actions/checkout@v4

      - name: Lee la etiqueta del esquema fijada en db-schema.lock
        id: schema
        run: echo "tag=$(tr -d '[:space:]' < db-schema.lock)" >> "$GITHUB_OUTPUT"

      - name: Descarga insumap-database en la etiqueta fijada
        uses: actions/checkout@v4
        with:
          repository: NicoalsD/insumap-database
          ref: ${{ steps.schema.outputs.tag }}
          path: .insumap-database

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Instala dependencias bloqueadas
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Formato (ruff format)
        run: uv run ruff format --check .

      - name: Tipos (mypy strict)
        run: uv run mypy

      - name: Contratos de arquitectura (import-linter)
        run: uv run lint-imports

      - name: Pruebas unitarias, de API y de integración con cobertura
        run: uv run pytest

  # Despliegue en AWS (.agents/deployment.md): solo tras un push a develop con la
  # calidad en verde. La imagen va a ECR y el host la aplica por SSM Run Command.
  deploy:
    name: despliegue en AWS
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-aws
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE: ${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Credenciales temporales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Construye y publica la imagen en ECR
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "${IMAGE%%/*}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Aplica la imagen en el host (SSM)
        env:
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
        run: |
          set -euo pipefail
          SCRIPT="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/infra/aws/host/deploy.sh"
          PARAMS=$(jq -cn --arg s "$SCRIPT" --arg i "$IMAGE" --arg c "$GITHUB_SHA" \
            '{commands: ["set -euo pipefail", "curl -fsSL \($s) -o /tmp/insumap-deploy.sh", "bash /tmp/insumap-deploy.sh \($i) \($c)"], executionTimeout: ["1200"]}')
          CMD=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "insumap ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" --query Command.CommandId --output text)
          echo "Comando SSM $CMD"
          for _ in $(seq 1 120); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; esac
            break
          done
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text | tail -n 60
          test "$STATUS" = Success
