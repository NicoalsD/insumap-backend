[project]
name = "insumap-backend"
version = "0.1.0"
description = "API REST de Insumap, plataforma de monitoreo de pacientes con diabetes."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.163.1",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.8",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insumap"]
