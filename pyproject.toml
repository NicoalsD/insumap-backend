[project]
name = "insumap-backend"
version = "0.1.0"
description = "API REST de Insumap, plataforma de monitoreo de pacientes con diabetes."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.163.1",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.8",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insumap"]

[dependency-groups]
dev = [
    "ruff==0.17.5",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "PL", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Asserts and magic numbers are idiomatic in tests; PLR2004 stays active in src/.
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
