[project]
name = "insumap-backend"
version = "0.1.0"
description = "API REST de Insumap, plataforma de monitoreo de pacientes con diabetes."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.163.1",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.1.8",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insumap"]

[dependency-groups]
dev = [
    "import-linter==2.16",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "PL", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Asserts and magic numbers are idiomatic in tests; PLR2004 stays active in src/.
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["insumap"]
python_version = "3.13"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=insumap --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: requiere Docker y PostgreSQL (Testcontainers)"]

[tool.coverage.run]
source = ["insumap"]
branch = true

[tool.importlinter]
root_package = "insumap"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: api > application > domain"
type = "layers"
layers = ["insumap.api", "insumap.application", "insumap.domain"]

[[tool.importlinter.contracts]]
name = "Domain is framework free"
type = "forbidden"
source_modules = ["insumap.domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "pydantic",
    "pydantic_settings",
    "httpx",
    "psycopg",
]

[[tool.importlinter.contracts]]
name = "Application does not touch web or database frameworks"
type = "forbidden"
source_modules = ["insumap.application"]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "psycopg"]

[[tool.importlinter.contracts]]
name = "Domain does not import outer layers"
type = "forbidden"
source_modules = ["insumap.domain"]
forbidden_modules = [
    "insumap.infrastructure",
    "insumap.api",
    "insumap.application",
]

[[tool.importlinter.contracts]]
name = "Shared kernel does not import other layers"
type = "forbidden"
source_modules = ["insumap.shared"]
forbidden_modules = [
    "insumap.api",
    "insumap.application",
    "insumap.domain",
    "insumap.infrastructure",
]
