# El esquema de la base de datos se aplica desde el repositorio insumap-database
# (`uv run alembic upgrade head` allí), nunca desde este repositorio.
services:
  db:
    image: postgres:18-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insumap}
      POSTGRES_DB: ${POSTGRES_DB:-insumap}
    ports:
      - "5432:5432"
    volumes:
      - insumap-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      # Dentro de la red de Compose la base se alcanza por el nombre del servicio.
      DATABASE_URL: postgresql://${POSTGRES_USER:-insumap}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-insumap}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  insumap-db-data:
